name: Go tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          files=$(gofmt -l internal/posta/source_autopilot_auto.go internal/posta/source_autopilot_auto_interval_test.go internal/posta/source_autopilot_queries.go internal/posta/source_autopilot_queries_selection_test.go internal/posta/source_autopilot_shadow.go internal/posta/source_autopilot_preliminary_test.go internal/posta/analysis.go internal/posta/parser.go internal/posta/professional_value_test.go internal/posta/topic_fast_search_test.go internal/posta/source_autopilot_hints.go internal/posta/source_autopilot_hints_test.go internal/posta/post_search.go internal/posta/query_search.go internal/posta/source_autopilot_post_hints.go internal/posta/source_autopilot_post_hints_test.go internal/posta/source_autopilot_direct.go internal/posta/source_autopilot_direct_test.go internal/posta/source_autopilot_delivery.go internal/posta/source_autopilot_queue.go internal/posta/source_autopilot_api.go internal/posta/kv.go)
          if [ -n "$files" ]; then
            for file in $files; do gofmt -d "$file"; done
            exit 1
          fi
      - name: Check autopilot interface JavaScript
        run: node --check js/sources.js
      - name: Unit tests
        run: go test ./...

  autopilot-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: posta_test
          POSTGRES_USER: posta
          POSTGRES_PASSWORD: posta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U posta -d posta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTA_AUTOPILOT_TEST_DSN: postgres://posta:posta_test@localhost:5432/posta_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify public source hint staging and owner-safe delivery
        run: go test ./internal/posta -run '^(TestAutopilotConsumesAcceptedSourceHintsPostgres|TestAutopilotDeliversContentPerOwnerPostgres|TestAutopilotDirectDeliversWithoutApprovedSourcePostgres)$' -count=1 -timeout=12m
