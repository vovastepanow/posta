name: Go tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          files=$(gofmt -l internal/posta/source_autopilot_auto.go internal/posta/source_autopilot_auto_interval_test.go internal/posta/source_autopilot_queries.go internal/posta/source_autopilot_queries_selection_test.go internal/posta/source_autopilot_shadow.go internal/posta/source_autopilot_worker_health.go internal/posta/source_autopilot_worker_health_test.go internal/posta/source_autopilot_prepare_projection_test.go internal/posta/source_autopilot_projection.go internal/posta/app.go internal/posta/app_init.go internal/posta/source_autopilot_backend_failures_test.go internal/posta/source_autopilot_fairness_test.go internal/posta/source_autopilot_lifecycle_test.go internal/posta/source_autopilot_resilience_test.go internal/posta/source_autopilot_restart_test.go internal/posta/source_autopilot_media_test.go internal/posta/source_autopilot_queries_test.go internal/posta/discovery.go internal/posta/source_autopilot_preliminary_test.go internal/posta/analysis.go internal/posta/parser.go internal/posta/professional_value_test.go internal/posta/topic_fast_search_test.go internal/posta/source_autopilot_hints.go internal/posta/source_autopilot_hints_test.go internal/posta/post_search.go internal/posta/query_search.go internal/posta/source_autopilot_post_hints.go internal/posta/source_autopilot_post_hints_test.go internal/posta/source_autopilot_direct.go internal/posta/source_autopilot_direct_test.go internal/posta/source_autopilot_delivery.go internal/posta/source_autopilot_delivery_isolation_test.go internal/posta/source_autopilot_queue.go internal/posta/source_autopilot_api.go internal/posta/kv.go internal/posta/source_youtube_keys.go internal/posta/source_youtube_poll_keys_test.go internal/posta/sources.go)
          if [ -n "$files" ]; then
            for file in $files; do gofmt -d "$file"; done
            exit 1
          fi
      - name: Check production health command formatting
        run: |
          files=$(gofmt -l cmd/posta/autopilot_health.go cmd/posta/autopilot_health_test.go cmd/posta/autopilot_audit.go cmd/posta/main.go internal/posta/source_autopilot_audit.go internal/posta/source_autopilot_audit_test.go internal/posta/source_autopilot_yield.go internal/posta/source_autopilot_yield_test.go internal/posta/source_autopilot_audit_trace.go internal/posta/source_autopilot_audit_trace_test.go internal/posta/source_autopilot_preliminary_probe.go internal/posta/source_autopilot_article.go internal/posta/source_autopilot_article_test.go internal/posta/source_autopilot_citations.go internal/posta/source_autopilot_citations_test.go internal/posta/source_autopilot_control.go internal/posta/source_autopilot_control_test.go internal/posta/source_autopilot_full_recheck.go internal/posta/source_autopilot_full_recheck_test.go)
          if [ -n "$files" ]; then
            for file in $files; do gofmt -d "$file"; done
            exit 1
          fi
      - name: Ensure Python stays outside the application runtime
        run: |
          # Python is allowed only in the isolated PMR and source-audit research trees, never in the Go app or deploy paths.
          if find . \( -path './research/pmr_datasets' -o -path './research/posta_multi' -o -path './research/source_audit' \) -prune -o -type f \( -name '*.py' -o -name '*.pyc' \) -print -quit | grep -q .; then
            echo "Python files outside explicitly permitted isolated research trees must not be checked in."
            exit 1
          fi
          if grep -q 'python3' deploy/auto-update.sh; then
            echo "The deploy script must not depend on Python."
            exit 1
          fi
      - name: Check deployment shell scripts
        run: bash -n deploy/auto-update.sh deploy/enable-auto-update.sh research/posta_multi/*.sh
      - name: Syntax-check all isolated Posta Multi Python research modules
        run: python3 -m compileall -q research/posta_multi
      - name: Unit-test private AV comparison report safety (Python stdlib)
        run: |
          PYTHONPATH=research/posta_multi python3 -m unittest discover \
            -s research/posta_multi -p 'test_av_checkpoint_compare.py' -v
      - name: Unit-test independent source audit helper (Python stdlib)
        run: python3 -m unittest discover -s research/source_audit/tests -v
      - name: Check autopilot interface JavaScript
        run: node --check js/sources.js
      - name: Unit tests
        run: go test ./...

  autopilot-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: posta_test
          POSTGRES_USER: posta
          POSTGRES_PASSWORD: posta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U posta -d posta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTA_AUTOPILOT_TEST_DSN: postgres://posta:posta_test@localhost:5432/posta_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify public source hint staging and owner-safe delivery
        run: go test ./internal/posta -run '^(TestAutopilotConsumesAcceptedSourceHintsPostgres|TestAutopilotDeliversContentPerOwnerPostgres|TestAutopilotDirectDeliversWithoutApprovedSourcePostgres|TestAutopilotEvidenceDedupPostgres|TestAutopilotAuditFunnelPostgres|TestAutopilotYieldEvidencePostgres)$' -count=1 -timeout=12m
      - name: Verify candidate queue, probation and activation with PostgreSQL
        run: go test ./internal/posta -run '^(TestAutopilotShadowQueuePostgres|TestMalformedCandidateDoesNotStarveAutopilotReviewPostgres|TestAutopilotModeClaimsDoNotStarvePostgres|TestAutopilotRecoversStaleFailuresWithoutBypassingQuotaPostgres|TestLegacyPendingTransferredOutOfManualShelfPostgres|TestAutopilotProbationNotStarvedByCandidateBacklogPostgres|TestAutopilotShadowEvidencePromotionPostgres|TestAutopilotCandidateToActiveLifecyclePostgres|TestAutopilotFullRecheckPostgres|TestAutopilotYieldMixedSourceLifecyclePostgres|TestAutopilotYieldPilotLifecyclePostgres|TestAutopilotClassifierFailureDoesNotBlockNextCandidatePostgres|TestAutopilotIndependentRestartAndLeaseRecoveryPostgres|TestAutopilotProjectionRespectsStateAndOverridePostgres|TestAutopilotPrepareSkipsInvalidRejectedProjectionsPostgres|TestAutopilotAutoDemandReconciliationPostgres)$' -count=1 -timeout=12m
      - name: Verify historic OK rejections with PostgreSQL
        run: go test ./internal/posta -run '^TestAutopilotReconsiderHistoricOKRejectsOnlyOncePostgres$' -count=1 -timeout=3m
      - name: Verify model failure recovery and text-only feeds
        run: go test ./internal/posta -run '^(TestAutopilotQueryUsesObservedYieldAndExploresPostgres|TestAutopilotQueryGenerationRetriesAfterProviderFailure|TestAutopilotGeneratesQueriesThroughModelGate|TestSourcePostsHaveImages|TestEvaluateTextOnlySourceWithoutImage|TestAutopilotPreliminaryPass|TestAutopilotSourceReviewInterval)$' -count=1 -timeout=5m
