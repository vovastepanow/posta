name: Posta NanoMIRACL RU EN full-nano-corpus BM25 evaluation

on:
  push:
    branches: [main]
    paths:
      - 'research/posta_multi/nanomiracl_benchmark.py'
      - 'research/posta_multi/bm25_baseline.py'
      - '.github/workflows/posta-miracl-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nanomiracl-ru-en:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evaluate BM25 against entire NanoMIRACL RU EN candidate corpora
        run: |
          mkdir -p eval-results
          PYTHONPATH=research/posta_multi python3 research/posta_multi/nanomiracl_benchmark.py \
            --output eval-results/nanomiracl-ru-en-bm25.json
      - name: Report independent Nano BM25 results without uploading text
        if: success()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          r = json.loads(Path('eval-results/nanomiracl-ru-en-bm25.json').read_text())
          lines = ['## NanoMIRACL RU/EN full supplied corpus BM25',
                   'Derived from MIRACL, NOT official dev nor full original corpus.',
                   'Publisher BM25 candidate lists (forced positives) were not used.',
                   '', '| Language | Queries | Documents | MRR | Recall@5 | nDCG@10 |',
                   '| --- | ---: | ---: | ---: | ---: | ---: |']
          for lang in ('ru','en'):
              v = r['languages'][lang]
              lines.append(f"| {lang} | {v['queries']} | {r['candidate_corpora'][lang]['documents']} | "
                           f"{v['mrr']:.4f} | {v['recall_5']:.4f} | {v['ndcg_10']:.4f} |")
          lines.append('Frozen source SHA-256: '+r['source_content_sha256'])
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY
      - name: Publish only aggregate numeric results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: posta-nanomiracl-ru-en-bm25
          path: eval-results/nanomiracl-ru-en-bm25.json
          if-no-files-found: error
          retention-days: 14
