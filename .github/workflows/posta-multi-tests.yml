name: Posta Multi research regression tests

on:
  push:
    branches: [main]
    paths:
      - 'research/posta_multi/**'
      - '.github/workflows/posta-multi-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: posta-multi-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-and-budget:
    name: Syntax and 235M budget (no dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile research Python source
        run: python3 -m compileall -q research/posta_multi
      - name: Validate declared parameter budget
        run: |
          PYTHONPATH=research/posta_multi python3 - <<'PY'
          from spec import parameter_counts
          assert parameter_counts()['total'] == 235179777
          print('Posta Multi 235M analytical count verified')
          PY

  cpu-unit-tests:
    name: CPU training, 235M Run 001 and multimodal tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/posta-multi-tests.yml
      - name: Install CPU PyTorch (never use GPU or HDD)
        run: |
          python3 -m pip install --disable-pip-version-check 'torch==2.7.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install --disable-pip-version-check 'tokenizers==0.22.1' 'numpy>=1.26,<3' 'Pillow>=10,<13'
      - name: Install isolated FFmpeg binary for the synthetic audio fixture
        run: |
          python3 -m pip install --disable-pip-version-check 'imageio-ffmpeg==0.6.0'
          mkdir -p "$RUNNER_TEMP/posta-bin"
          ln -s "$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$RUNNER_TEMP/posta-bin/ffmpeg"
          echo "$RUNNER_TEMP/posta-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/posta-bin/ffmpeg" -version | head -n 1
      - name: Check isolated host compare shells
        run: bash -n research/posta_multi/host_compare_hook.sh research/posta_multi/host_compare_worker.sh research/posta_multi/host_retrieval_hook.sh research/posta_multi/host_retrieval_worker.sh research/posta_multi/host_holdout_hook.sh research/posta_multi/host_holdout_worker.sh research/posta_multi/host_geometry_hook.sh research/posta_multi/host_geometry_worker.sh research/posta_multi/host_split_audit_hook.sh research/posta_multi/host_split_audit_worker.sh research/posta_multi/host_checkpoint_decision_hook.sh research/posta_multi/host_run001_smoke_hook.sh research/posta_multi/host_run001_smoke_worker.sh research/posta_multi/host_run001_preflight_hook.sh research/posta_multi/host_run001_preflight_worker.sh research/posta_multi/host_run001_seq96_hook.sh research/posta_multi/host_run001_seq96_worker.sh research/posta_multi/host_run001_retrieval_smoke_hook.sh research/posta_multi/host_run001_retrieval_smoke_worker.sh research/posta_multi/host_bm25_hook.sh research/posta_multi/host_bm25_worker.sh research/posta_multi/host_miracl_benchmark_hook.sh research/posta_multi/host_miracl_benchmark_worker.sh research/posta_multi/host_nanomiracl_hook.sh research/posta_multi/host_nanomiracl_worker.sh research/posta_multi/host_source_audit_hook.sh research/posta_multi/host_source_audit_worker.sh research/posta_multi/host_source_preview_hook.sh research/posta_multi/host_source_preview_worker.sh research/posta_multi/host_run001_tokenizer_audit_hook.sh research/posta_multi/host_run001_tokenizer_audit_worker.sh research/posta_multi/host_run001_content_intake_hook.sh research/posta_multi/host_run001_content_intake_worker.sh research/posta_multi/host_run001_hdd_inventory_hook.sh research/posta_multi/host_run001_hdd_inventory_worker.sh
      - name: Run offline model and trainer regression tests
        run: python3 -m unittest discover -s research/posta_multi -p 'test_*.py' -v
