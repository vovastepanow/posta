<!doctype html><meta charset=utf-8><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@900&display=swap">
<style>html,body{margin:0;background:#fff}canvas{display:block}</style><canvas id=c></canvas>
<script>
// Фавиконка: «post» и «maker» растянуты на весь квадрат, 1 px от краёв и между строками в пикселях целевого размера
const N = +location.hash.slice(1) || 32, c = document.getElementById('c'), x = c.getContext('2d');
c.width = c.height = N;
document.fonts.load('900 100px Jost').then(() => {
  x.fillStyle = '#FFDA1A'; x.fillRect(0, 0, N, N);
  const pad = 1, gap = 1, W = N - 2 * pad, H = (N - 2 * pad - gap) / 2;
  ['post', 'maker'].forEach((t, i) => {
    x.font = '900 100px Jost'; const m = x.measureText(t);
    const iw = m.actualBoundingBoxLeft + m.actualBoundingBoxRight, ih = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
    x.save(); x.translate(pad, pad + i * (H + gap)); x.scale(W / iw, H / ih);
    x.fillStyle = '#111'; x.fillText(t, m.actualBoundingBoxLeft, m.actualBoundingBoxAscent); x.restore();
  });
  document.title = 'done';
});
</script>
